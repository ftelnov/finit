listen: ":8081"

providers:
  - name: minimax-m2.7
    url: "http://10.70.2.11:8006/v1"
    weight: 1
    timeout_ms: 180000
    max_concurrent: 8
    models:
      /opt/MiniMaxAI/MiniMax-M2.7:
        pricing: { input_per_1m: 0.0, output_per_1m: 0.0 }
        context_window: 196608
        max_output_tokens: 16384

balancing:
  strategy: "round-robin"
  health_aware: true

circuit_breaker:
  failure_threshold: 5
  failure_window_s: 60
  cooldown_s: 30

guardrails:
  prompt_injection: false
  secret_scan: false

budget:
  default_max_tokens: 1000000
  default_max_calls: 200

mlflow:
  tracking_uri: "http://mlflow:5000"
  experiment_name: "finit-eval"
  log_prompts: true

cache:
  enabled: false
  ttl_seconds: 0

telemetry:
  otlp_endpoint: "otel-collector:4317"
