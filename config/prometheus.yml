global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8080']
    metrics_path: '/metrics'

  - job_name: 'llm-router'
    static_configs:
      - targets: ['llm-router:8081']
    metrics_path: '/metrics'

  - job_name: 'planner'
    static_configs:
      - targets: ['planner:9000']
    metrics_path: '/metrics'

  - job_name: 'bootstrapper'
    static_configs:
      - targets: ['bootstrapper:9001']
    metrics_path: '/metrics'

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:9002']
    metrics_path: '/metrics'

  - job_name: 'reviewer'
    static_configs:
      - targets: ['reviewer:9003']
    metrics_path: '/metrics'

  - job_name: 'mock-llm'
    static_configs:
      - targets: ['mock-llm:8000']
    metrics_path: '/metrics'
