route:
  group_by: ['severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook'
      repeat_interval: 15m

    - match:
        severity: warning
      receiver: 'default'
      repeat_interval: 4h

receivers:
  - name: 'default'
    # Grafana annotations — no push notifications for warnings

  - name: 'critical-webhook'
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true
